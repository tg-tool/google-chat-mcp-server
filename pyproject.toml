[project]
name = "google-chat-mcp-server"
version = "0.1.0"
description = "Minimal read-only Google Chat MCP server for Claude Code"
readme = "README.md"
authors = [{ name = "tg-tool" }]
license = "MIT"
requires-python = ">=3.12"
dependencies = [
    "mcp>=2.3,<3",
    "google-api-python-client>=2.200",
    "google-auth>=2.60",
    "google-auth-oauthlib>=1.5",
    "google-auth-httplib2>=0.2",
]

[project.optional-dependencies]
dev = ["pytest>=9", "ruff>=0.17"]

[project.scripts]
google-chat-mcp = "google_chat_mcp.server:main"
google-chat-mcp-auth = "google_chat_mcp.auth:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/google_chat_mcp"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = [
    "E501",  # line-too-long (Japanese messages can be long)
]
